     ============================================================================== -->

  <div class="cerca-container">
    <div class="cerca-topbar-inner">
      <div class="d-flex align-items-center gap-2">
        <span class="cerca-topbar-badge">
          <i class="fas fa-radar"></i> Canlı Keşif
        </span>

      </div>
      <ul class="cerca-topbar-links">
