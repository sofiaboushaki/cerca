<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="cercaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5500" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Icon: Location pin merged with sound wave / event radar -->
  <g transform="translate(8, 8)" filter="url(#shadow)">
    <rect width="48" height="48" rx="14" fill="url(#cercaGrad)" />
    <!-- Pin & Radar Wave -->
    <circle cx="24" cy="20" r="7" stroke="#FFFFFF" stroke-width="3" fill="none" />
    <circle cx="24" cy="20" r="2.5" fill="#FFFFFF" />
    <path d="M24 28 C24 33 24 37 24 38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M12 20 A 12 12 0 0 1 36 20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" fill="none"/>
    <path d="M8 20 A 16 16 0 0 1 40 20" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.35" fill="none"/>
  </g>
  <!-- Brand Text -->
  <text x="70" y="41" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5" fill="#1E2022">
    cerca
  </text>
  <circle cx="152" cy="38" r="4.5" fill="#FF6600" />
  <text x="164" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#FF6600">YAKINDA</text>
  <text x="164" y="41" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="0.2" fill="#68717A">Kültür & Sanat</text>
</svg>
